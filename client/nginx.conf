# =============================================================================
# AdiYogi SPA — nginx site configuration
#
# This file is a TEMPLATE. client/Dockerfile copies it to
#   /etc/nginx/templates/default.conf.template
# and the official nginx image entrypoint
# (/docker-entrypoint.d/20-envsubst-on-templates.sh) renders it to
# /etc/nginx/conf.d/default.conf at container start.
#
# That script passes an explicit list of environment variable names to envsubst,
# so ONLY variables that exist in the container environment are substituted
# (${API_UPSTREAM} below). nginx runtime variables ($uri, $host, $remote_addr,
# $proxy_add_x_forwarded_for, $scheme, $api_upstream) are NOT environment
# variables and are therefore left untouched.
#
#   API_UPSTREAM = full API origin INCLUDING scheme
#                  docker compose default: http://api:4000
#                  external API:          https://api.example.com
#
# The SPA is built with a relative API base ("/api/v1"), so /api/ is proxied
# same-origin. That keeps the session cookies first-party, which means
# COOKIE_SAMESITE=lax works and no cross-site cookie exception is needed.
# =============================================================================

# Docker's embedded DNS. Needed because proxy_pass uses a variable ($api_upstream),
# which makes nginx re-resolve the upstream per request instead of caching the
# container IP at startup — so an API restart (new IP) does not require a web
# container restart. `ipv6=off` avoids AAAA lookups failing in compose networks.
resolver 127.0.0.11 ipv6=off valid=10s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version.
    server_tokens off;
    charset utf-8;

    # API JSON bodies are capped at 100kb server-side; leave headroom.
    client_max_body_size 1m;

    # --- compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # --- security headers --------------------------------------------------
    # NOTE: nginx does not inherit add_header into a location that declares its
    # own add_header. Private caches below use `expires` (not add_header) so they
    # keep inheriting these; the immutable-asset location repeats the headers it
    # needs. Keep the CSP in sync with docs/SECURITY.md and vercel.json.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'; worker-src 'self'; media-src 'self'" always;

    # HSTS is deliberately NOT set here: this container serves plain HTTP (TLS is
    # terminated by the platform/CDN in front of it), and setting it would pin
    # http://localhost:8080 to HTTPS during local development. Set
    # Strict-Transport-Security at the edge/proxy (see docs/DEPLOYMENT.md).

    # --- container / load-balancer healthcheck -----------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- API reverse proxy -------------------------------------------------
    location /api/ {
        set $api_upstream ${API_UPSTREAM};
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 75s;
        # AI chat budget is AI_TIMEOUT_MS (default 20s) + one retry + provider
        # latency. Keep this above it so nginx does not 504 before the API can
        # return its own explicit 503 AI_UNAVAILABLE.
        proxy_read_timeout 75s;
    }

    # --- caching -----------------------------------------------------------
    # Vite emits /assets/<name>-<contenthash>.js|css, so those files can be
    # cached forever. This location sets its own add_header, which switches off
    # add_header inheritance from the server block — repeat the one header that
    # matters for a static asset (nosniff) so MIME-sniffing stays disabled.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The HTML shell must revalidate on every deploy (it references the new
    # hashed asset names). `expires -1` emits Cache-Control: no-cache; because it
    # is not add_header, the security headers above still apply.
    location = /index.html {
        expires -1;
    }

    # --- SPA routing -------------------------------------------------------
    # Deep links (/boards/:slug, /threads/:id, /chat, ...) are handled by React
    # Router: anything that is not a real file falls back to index.html.
    location / {
        expires 1h;
        try_files $uri $uri/ /index.html;
    }
}
